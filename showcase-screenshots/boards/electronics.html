<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electronics Direction Board</title>
<style>
body { margin: 0; background: #111; color: #f6f1e8; font-family: system-ui, sans-serif; }
main { padding: 48px; }
h1 { font-size: 64px; line-height: .92; letter-spacing: -.06em; margin: 0 0 16px; max-width: 980px; }
p { color: #c9c0b6; font-size: 20px; line-height: 1.6; max-width: 860px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 42px; }
figure { background: #1c1c1c; border: 1px solid rgba(255,255,255,.1); margin: 0; overflow: hidden; }
img { display: block; height: 360px; object-fit: cover; object-position: top; width: 100%; }
figcaption { color: #f6f1e8; font-size: 13px; letter-spacing: .12em; padding: 14px; text-transform: uppercase; }
</style>
</head>
<body>
<main>
<h1>Electronics</h1>
<p>High-contrast technical surfaces, product-first grids, precision spacing, and specification-led hierarchy.</p>
<section class="grid">
			<figure>
				<img src="../portfolio/electronics/desktop/homepage.png" alt="Electronics homepage desktop screenshot">
				<figcaption>homepage</figcaption>
			</figure>
			<figure>
				<img src="../portfolio/electronics/desktop/category.png" alt="Electronics category desktop screenshot">
				<figcaption>category</figcaption>
			</figure>
			<figure>
				<img src="../portfolio/electronics/desktop/shop.png" alt="Electronics shop desktop screenshot">
				<figcaption>shop</figcaption>
			</figure>
			<figure>
				<img src="../portfolio/electronics/desktop/product.png" alt="Electronics product desktop screenshot">
				<figcaption>product</figcaption>
			</figure>
			<figure>
				<img src="../portfolio/electronics/desktop/cart.png" alt="Electronics cart desktop screenshot">
				<figcaption>cart</figcaption>
			</figure>
			<figure>
				<img src="../portfolio/electronics/desktop/checkout.png" alt="Electronics checkout desktop screenshot">
				<figcaption>checkout</figcaption>
			</figure>
			<figure>
				<img src="../portfolio/electronics/desktop/my-account.png" alt="Electronics my-account desktop screenshot">
				<figcaption>my account</figcaption>
			</figure></section>
</main>
</body>
</html>
