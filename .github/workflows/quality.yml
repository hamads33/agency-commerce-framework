name: Framework quality
on:
  pull_request:
  push:
    branches: [main, 'hardening/**', 'frontend/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: npm ci
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint:php && composer lint
      - run: find tests/backend -name '*.php' -exec php -l '{}' +
      - run: npm run lint:js
      - run: npm run build
      - run: git diff --exit-code -- wp-content
      - run: npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wordpress-release-candidates
          path: build/release/*.zip
          if-no-files-found: error

  backend:
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        clean-run: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:backend
        env:
          AGENCY_RUN_NAVIGATION: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-logs-${{ matrix.clean-run }}
          path: ~/.cache/agency-backend/run.*/*.log
          if-no-files-found: ignore

  release-install:
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-install-logs
          path: ~/.cache/agency-release/run.*/*.log
          if-no-files-found: ignore
